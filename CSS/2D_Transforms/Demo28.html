<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom on hover</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container{
            width: 500px;
            overflow: hidden;
            border: 1px solid red;
        }
        .container>div{
            background-color: yellow;
            width: 100%;
            text-align: center;
            position: absolute;
        }

       img{
        width: 100%;
       }
        .container>img:hover{
            cursor: zoom-in;
            transform: scale(110%,110%);
            transition: all 1s;
        }
    </style>
</head>
<body>
    <div class="container">
        
            <img src="../../images/the_rock.jpg" alt="">
        
        
        <div>
            THE ROCK
        </div>
    </div>
</body>
</html>
