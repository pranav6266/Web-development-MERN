<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinators</title>
    <style>
    div~h1{
            background-color: navy;
            color: aliceblue;
        }
    </style>
</head>

<body>
    <div>
        <h1>Heading 1</h1>
        <h1>Heading 2</h1>
        <span>
            <h1>Inside div Heading 3</h1>
            <h1>Inside div Heading 4</h1>
        </span>
        <h1>Outside inner div Heading 5</h1>
        <h1>Outside inner div Heading 6</h1>
    </div>


    <h1>Outside outer div Heading 7</h1>
    <h1>Outside outer div Heading 8</h1>

</body>

</html>
