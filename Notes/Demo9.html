<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <body>
        <form>

            <table border="1px" width="500px" align="center">
                <tbody>
                    <tr>
                        <td>User Name </td>
                        <td>
                            <input type="text" name="unm" placeholder="Enter Your Name" maxlength="10" minlength="2"
                                required />
                        </td>
                    </tr>

                    <tr>
                        <td>
                            Password
                        </td>
                        <td>
                            <input type="password" name="pwd" placeholder="Eg:Pass@12345" />
                        </td>
                    </tr>

                    <tr>
                        <td> User Mail </td>
                        <td>
                            <input type="email" name="mailId" />
                        </td>
                    </tr>

                    <tr>
                        <td> Date of Birth </td>
                        <td>
                            <input type="date" name="dob" min="2024-10-15" max="2025-06-25" />
                        </td>
                    </tr>

                    <tr>
                        <td> Time </td>
                        <td>
                            <input type="time" name="time" />
                        </td>
                    </tr>

                    <tr>
                        <td> Date / Time </td>
                        <td>
                            <input type="datetime-local" name="time" />
                        </td>
                    </tr>

                    <tr>
                        <td> Gender </td>
                        <td>
                            <input type="radio" name="gen" required />Male
                            <input type="radio" name="gen" />Female
                        </td>
                    </tr>

                    <tr>
                        <td> Hobbies </td>
                        <td>
                            <input type="checkbox" name="hobb1" />Playing
                            <input type="checkbox" name="hobb2" />Singing
                            <input type="checkbox" name="hobb3" />Swimming
                            <input type="checkbox" name="hobb4" />Reading

                        </td>
                    </tr>

                    <tr>
                        <td>
                            Mobile Number
                        </td>
                        <td>
                            <input type="tel" name="mobNo" />
                        </td>
                    </tr>

                    <tr>
                        <td>
                            CGPI
                        </td>
                        <td>
                            <input type="number" name="cgpi" min="1" max="10" />
                        </td>
                    </tr>

                    <tr>
                        <td>
                            Qualification
                        </td>
                        <td>
                            <select>
                                <option disabled selected>~~Select~~</option>
                                <option>BTech</option>
                                <option>MTech</option>
                                <option>MBA</option>
                                <option>BBA</option>
                                <option disabled>BCA</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            City Name
                        </td>
                        <td>
                            <select>
                                <option disabled selected>~~Select~~</option>
                                <optgroup label="UP">
                                    <option>Kanpur</option>
                                    <option>Lucknow</option>
                                    <option>Agra</option>
                                </optgroup>
                                <optgroup label="MP">
                                    <option>Bhopal</option>
                                    <option>Indore</option>
                                    <option>Sagar</option>
                                </optgroup>
                                <optgroup label="Rajasthan">
                                    <option>Jaipur</option>
                                    <option>Udaipur</option>
                                    <option>Kota</option>
                                </optgroup>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            University Name
                        </td>
                        <td>
                            <input type="text" name="uni_nm" list="mylist" />
                            <datalist id="mylist">
                                <option>AKTU</option>
                                <option>CSJMU</option>
                                <option>LPU</option>
                                <option>PU</option>
                                <option>CU</option>
                                <option>VIT</option>
                                <option>KIIT</option>
                                <option>SMU</option>
                            </datalist>

                        </td>
                    </tr>

                    <tr>
                        <td>Range </td>
                        <td>
                            <input type="range" />
                        </td>
                    </tr>

                    <tr>
                        <td>Search</td>
                        <td>
                            <input type="search" name="ser_value" />
                        </td>
                    </tr>

                    <tr>
                        <td>Color</td>
                        <td>
                            <input type="color" name="" />
                        </td>
                    </tr>

                    <tr>
                        <td>Hidden Value</td>
                        <td>
                            <input type="hidden" name="" value="Emp1005" />
                        </td>
                    </tr>

                    <tr>
                        <td>Month</td>
                        <td>
                            <input type="month" />
                        </td>
                    </tr>
                    <tr>
                        <td>Week</td>
                        <td>
                            <input type="week" />
                        </td>
                    </tr>

                    <tr>
                        <td>Upload Pic</td>
                        <td>
                            <input type="file" name="" accept=".jpg , .pdf" multiple />
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Address
                        </td>
                        <td>
                            <textarea rows="5" cols="30" placeholder="Enter Address"></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <input type="submit" />
                            <input type="reset" />
                            <input type="button" value="Button" />
                            <input type="image" value="qwert6u" src="./Images/btn.PNG" width="100px" height="50px" />

                            <button type="submit">
                                &#128512; Login
                            </button>
                        </td>
                    </tr>



                </tbody>

            </table>


        </form>
    </body>

</html>
