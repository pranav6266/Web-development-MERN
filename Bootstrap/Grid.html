<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"

    <title>Grid</title>
    <style>
       .container .row > div{ 
            text-align: center;    
        }

        .container .row > div:nth-child(even){
            background-color: yellow;
        }
        .container .row > div:nth-child(odd){
            background-color: dodgerblue;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="row">
        <div class="col">Div 1</div>
        <div class="col">Div 2</div>
        <div class="col">Div 3</div>
        <div class="col">Div 4</div>
        <div class="col">Div 5</div>
        <div class="col">Div 6</div>
        <div class="col">Div 7</div>
        <div class="col">Div 8</div>
        <div class="col">Div 9</div>
        <div class="col">Div 10</div>
        <div class="col">Div 11</div>
        <div class="col">Div 12</div>
        </div>
        <br><br><br>
        <div class="row">
            <div class="col">Div 1</div>
            <div class="col">Div 2</div>
            <div class="col">Div 3</div>
            <div class="col">Div 4</div>
            <div class="col">Div 5</div>

        </div>

        <br><br><br>
        <div class="row">
            <div class="col">Div 1</div>
            <div class="col">Div 2</div>
            <div class="col">Div 3</div>
            <div class="col">Div 4</div>
        </div>
    </div>

            crossorigin="anonymous"></script>
</body>

</html>
