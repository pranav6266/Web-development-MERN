<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>btn class</title>
</head>

<body>
    <br><br>
    <button class="btn btn-primary" >Primary Button</button>
    <button class="btn btn-secondary" >Secondary Button</button>
    <button class="btn btn-info" >Info Button</button>
    <button class="btn btn-success">Success Button</button>
    <a href="./Demo1.html" class="btn btn-danger">Link</a> <br><br>

    <button type="button" class="btn btn-info btn-lg">Large Button</button>
    <button type="button" class="btn btn-info btn-sm">Small Button</button>

    <button type="button" class="btn btn-link">Link Button</button> <br><br>

    <button type="button" class="btn btn-outline-danger">Outline Button</button> <br><br>

    <button type="button" class="btn btn-success btn-block">Block Button</button>
