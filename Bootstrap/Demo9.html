<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>Carousel</title>
    <style>
        .carousel-item img {
            height: 400px;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="carousel slide carousel-fade" data-pause="false" data-interval="2000" data-ride="carousel" id="myCarousel">
        <div class="carousel-inner">
            <div class="carousel-item active"><img src="../images/python.jpg"></div>
            <div class="carousel-item">
                <img src="../images/the_rock.jpg">
                <p class="carousel-caption"
                    style="background-color: yellow; text-align: center; font-size: xx-large; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; color: brown;">
                    The Rock Is a very famous WWE Fighter</p>
            </div>
            <div class="carousel-item"><img src="../images/java.png"></div>
            <div class="carousel-item"><img src="../images/c++.jpg"></div>

            <!-- Controller Buttons -->
            <a class="carousel-control-prev" data-slide="prev" href="#myCarousel">
                <span class="carousel-control-prev-icon"></span>
            </a>
            <a class="carousel-control-next" data-slide="next" href="#myCarousel">
                <span class="carousel-control-next-icon"></span>
            </a>


            <!-- Indicators -->
             <ul class="carousel-indicators">
                <li class="active" data-target="#myCarousel" data-slide-to="0"></li>
                <li data-target="#myCarousel" data-slide-to="1"></li>
                <li data-target="#myCarousel" data-slide-to="2"></li>
                <li data-target="#myCarousel" data-slide-to="3"></li>
             </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
</body>

</html>
